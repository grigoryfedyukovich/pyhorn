[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhorn-bounded-explorer"
version = "0.5.0"
description = "Standalone Python/Z3 exhaustive bounded explorer for linear CHCs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.13.0.0,<5"]

[project.scripts]
pyhorn-expl = "pyhorn_bnd.cli:main"
chc-bounded-explorer = "pyhorn_bnd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyhorn_bnd*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py310"
line-length = 88
