[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyhorn-bounded-explorer"
version = "0.0.18"
description = "Python/Z3 bounded exploration, seed-Houdini, and trace-guided Houdini analysis for linear CHCs"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["z3-solver>=4.13.0.0,<5", "sympy>=1.12,<2"]

[project.scripts]
pyhorn-expl = "pyhorn_bnd.cli:main"
chc-bounded-explorer = "pyhorn_bnd.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["pyhorn_bnd*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["corpus: external full-corpus parser regression"]

[tool.ruff]
target-version = "py310"
line-length = 88
